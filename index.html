<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Todo App (C Backend)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        ul {
            list-style: none;
            margin-top: 10px;
        }

        li {
            background: #f8f9fa;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        li:hover {
            transform: scale(1.02);
        }

        .todo-text {
            flex: 1;
            margin-right: 10px;
        }

        .actions button {
            margin-left: 6px;
            padding: 6px 10px;
            font-size: 14px;
            border-radius: 6px;
        }

        .edit-btn {
            background: #ffc107;
        }

        .edit-btn:hover {
            background: #e0a800;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #a71d2a;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            input,
            button {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Todo App (C Backend)</h1>
        <form id="todoForm">
            <input type="text" id="todoInput" placeholder="Enter a new todo..." required>
            <button type="submit">Add</button>
        </form>
        <ul id="todoList"></ul>
    </div>

    <script>
        async function fetchTodos() {
            const res = await fetch('/api/todos');
            const todos = await res.json();
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            todos.forEach(todo => {
                const li = document.createElement('li');

                const span = document.createElement('span');
                span.className = 'todo-text';
                span.textContent = todo.text;

                const actions = document.createElement('div');
                actions.className = 'actions';

                // Edit button
                const editBtn = document.createElement('button');
                editBtn.textContent = '✏️';
                editBtn.className = 'edit-btn';
                editBtn.onclick = async () => {
                    const newText = prompt("Edit todo:", todo.text);
                    if (newText) {
                        await fetch(`/api/todos/${todo.id}`, { method: "PUT", body: newText });
                        fetchTodos();
                    }
                };

                // Delete button
                const delBtn = document.createElement('button');
                delBtn.textContent = '🗑️';
                delBtn.className = 'delete-btn';
                delBtn.onclick = async () => {
                    await fetch(`/api/todos/${todo.id}`, { method: "DELETE" });
                    fetchTodos();
                };

                actions.appendChild(editBtn);
                actions.appendChild(delBtn);
                li.appendChild(span);
                li.appendChild(actions);
                list.appendChild(li);
            });
        }

        document.getElementById('todoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('todoInput');
            await fetch('/api/todos', { method: 'POST', body: input.value });
            input.value = '';
            fetchTodos();
        });

        fetchTodos();
    </script>
</body>

</html>
